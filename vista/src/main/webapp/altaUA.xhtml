<?xml version='1.0' encoding='UTF-8' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/templates/layout.xhtml">

    <ui:param name="activePage" value="ua"/>

    <ui:define name="title">SAUAP - Alta de UA</ui:define>

    <ui:define name="content">

        <h2 class="section-title">Alta de Unidad de Aprendizaje</h2>
        <p class="section-subtitle">Registra una nueva unidad de aprendizaje en el catálogo</p>

        <h:form id="uaForm">

            <p:messages id="messages" showDetail="true" closable="true" globalOnly="false" />

            <div class="content-card">

                <h3 class="card-title">Datos de la Unidad de Aprendizaje</h3>
                <p class="card-subtitle">Todos los campos son obligatorios</p>
                <hr class="card-divider"/>

                <div class="form-field">
                    <h:outputLabel for="nombre" value="Nombre" />
                    <p:inputText id="nombre"
                                 styleClass="form-input-long"
                                 placeholder="Nombre de la UA"
                                 value="#{uaUI.UA.nombre}"
                                 maxlength="50" minlength="3" pattern="(?=.*[A-Za-z])[A-Za-záéíóúÁÉÍÓÚñÑ\s-0-9]"
                                 required="true"
                                 requiredMessage="Ingresa el nombre de la Unidad de Aprendizaje."/>
                </div>

                <div class="form-field">
                    <h:outputLabel for="horasClase" value="Horas Clase" />
                    <p:selectOneMenu id="horasClase"
                                     widgetVar="horasClaseW"
                                     styleClass="form-select-short"
                                     value="#{uaUI.UA.horasClase}"
                                     required="true"
                                     requiredMessage="Selecciona las Horas Clase.">
                        <f:selectItem itemLabel="0" itemValue="0"/>
                        <f:selectItem itemLabel="1" itemValue="1"/>
                        <f:selectItem itemLabel="2" itemValue="2"/>
                        <f:selectItem itemLabel="3" itemValue="3"/>
                        <f:selectItem itemLabel="4" itemValue="4"/>
                    </p:selectOneMenu>
                </div>

                <div class="form-field">
                    <h:outputLabel for="horasTaller" value="Horas Taller" />
                    <p:selectOneMenu id="horasTaller"
                                     widgetVar="horasTallerW"
                                     styleClass="form-select-short"
                                     value="#{uaUI.UA.horasTaller}"
                                     required="true"
                                     requiredMessage="Selecciona las Horas Taller.">
                        <f:selectItem itemLabel="0" itemValue="0"/>
                        <f:selectItem itemLabel="1" itemValue="1"/>
                        <f:selectItem itemLabel="2" itemValue="2"/>
                        <f:selectItem itemLabel="3" itemValue="3"/>
                        <f:selectItem itemLabel="4" itemValue="4"/>
                    </p:selectOneMenu>
                </div>

                <div class="form-field">
                    <h:outputLabel for="horasLaboratorio" value="Horas Laboratorio" />
                    <p:selectOneMenu id="horasLaboratorio"
                                     widgetVar="horasLaboratorioW"
                                     styleClass="form-select-short"
                                     value="#{uaUI.UA.horasLaboratorio}"
                                     required="true"
                                     requiredMessage="Selecciona las Horas Laboratorio.">
                        <f:selectItem itemLabel="0" itemValue="0"/>
                        <f:selectItem itemLabel="1" itemValue="1"/>
                        <f:selectItem itemLabel="2" itemValue="2"/>
                        <f:selectItem itemLabel="3" itemValue="3"/>
                        <f:selectItem itemLabel="4" itemValue="4"/>
                    </p:selectOneMenu>
                </div>

                <div class="form-actions">
                    <p:commandButton value="Guardar UA"
                                     styleClass="btn-primary"
                                     action="#{uaUI.registrar}"
                                     process="@form"
                                     update="messages @form"
                                     ajax="true"/>
                    <p:commandButton value="Limpiar campos"
                                     type="reset"
                                     styleClass="btn-primary"
                                     ajax="false"
                                     immediate="true"/>
                </div>

            </div>

        </h:form>

    </ui:define>

</ui:composition>
