<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>SAUAP - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
    <link href="https://fonts.googleapis.com/css2?family=Martel+Sans:wght@600&amp;display=swap" rel="stylesheet"/>
    <h:outputStylesheet name="style.css" />
</h:head>

<h:body>
    <div class="login-bg" style="background-image: url('#{resource['fondoSAUAP.png']}');">
        <h:form id="loginForm">

            <p:messages id="messages" showDetail="true" closable="true" globalOnly="false" />

            <div class="login-card">

                <p:graphicImage url="resources/logoSAUAPlogin.png"
                                styleClass="login-logo" alt="SAUAP"/>

                <p class="login-subtitle">
                    Sistema de Asignación de Unidades de Aprendizaje a Profesores
                </p>

                <div class="login-field-usuario">
                    <h:outputLabel for="usuario" value="Usuario" />
                    <p:inputText id="usuario"
                                 styleClass="login-input"
                                 value="#{loginUI.usuario.usuario}"
                                 required="true"
                                 requiredMessage="Ingresa tu usuario."
                                 autocomplete="off"/>
                </div>

                <div class="login-field-contrasena">
                    <h:outputLabel for="contrasena" value="Contraseña" />
                    <p:password id="contrasena"
                                styleClass="login-input"
                                value="#{loginUI.usuario.contrasena}"
                                required="true"
                                requiredMessage="Ingresa tu contraseña."
                                feedback="false"
                                redisplay="false"/>
                </div>

                <p:commandButton value="Iniciar Sesión"
                                 styleClass="login-button"
                                 actionListener="#{loginUI.iniciarSesion()}"
                                 process="@form"
                                 update="messages"
                                 ajax="true"/>

            </div>

        </h:form>
    </div>
</h:body>
</html>
