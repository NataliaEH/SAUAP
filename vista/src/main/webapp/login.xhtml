<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="http://primefaces.org/ui">

    <h:head>
        <title>SAUAP · Iniciar sesión</title>
        <h:outputStylesheet name="style.css" />
    </h:head>

    <h:body>
        <div class="login-bg">
            <h:form id="loginForm">

                <p:messages id="messages" showDetail="true" closable="true" globalOnly="true" />

                <div class="login-card">

                    <p:graphicImage url="resources/logoSAUAPlogin.png"
                                styleClass="login-logo" alt="SAUAP"/>

                <p class="login-subtitle">
                    Sistema de Asignación de Unidades de Aprendizaje a Profesores
                </p>

                <div class="login-field-usuario">
                    <h:outputLabel for="usuario" value="Usuario" />
                    <p:inputText id="usuario"
                                 styleClass="login-input"
                                 value="#{loginUI.usuario.correo}"
                                 required="true"
                                 requiredMessage="Ingresa tu usuario."
                                 autocomplete="off"/>
                    <p:message for="usuario" showDetail="false" showSummary="true"/>
                </div>

                <div class="login-field-contrasena">
                    <h:outputLabel for="contrasena" value="Contraseña" />
                    <p:password id="contrasena"
                                styleClass="login-input"
                                value="#{loginUI.usuario.contrasena}"
                                required="true"
                                requiredMessage="Ingresa tu contraseña."
                                feedback="false"
                                redisplay="false"/>
                    <p:message for="contrasena" showDetail="false" showSummary="true"/>
                </div>

                    <p:commandButton value="Iniciar Sesión"
                                 styleClass="login-button"
                                 actionListener="#{loginUI.login()}"
                                 process="@form"
                                 update="messages"
                                 ajax="true"/>

                </div>

            </h:form>
        </div>
    </h:body>
</html>
