<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>SAUAP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
    <link href="https://fonts.googleapis.com/css2?family=Martel+Sans:wght@600&amp;display=swap" rel="stylesheet"/>
    <h:outputStylesheet name="style.css" />
</h:head>


<h:body>
    <div class="app-shell">

        <div class="app-topbar">
            <p:graphicImage url="resources/logoLargoSAUAP.png"
                            styleClass="app-logo-long" alt="SAUAP"/>
        </div>

        <div class="app-body">

            <div class="app-sidebar">
                <div class="nav-section-label">Gestión</div>
                <div class="nav-item active" onclick="selectNav(this)">
                    <i class="pi pi-user"></i>
                    <span>Profesores</span>
                </div>
                <div class="nav-item" onclick="selectNav(this)">
                    <i class="pi pi-book"></i>
                    <span>Unidades de Aprendizaje</span>
                </div>

                <div class="nav-section-label">Consultas y Modificaciones</div>
                <div class="nav-item" onclick="selectNav(this)">
                    <i class="pi pi-users"></i>
                    <span>Consulta de Profesores</span>
                </div>
                <div class="nav-item" onclick="selectNav(this)">
                    <i class="pi pi-link"></i>
                    <span>Consulta de Asignaciones</span>
                </div>
                <div class="nav-item" onclick="selectNav(this)">
                    <i class="pi pi-search"></i>
                    <span>Consulta de UA</span>
                </div>

                <div class="nav-footer">
                    <i class="pi pi-sign-out"></i>
                    <span>Salir</span>
                </div>
            </div>

            <div class="app-main" style="background-image: url('#{resource['fondoSAUAP.png']}');">

                <div class="welcome-banner">
                    Bienvenido, Administrador.
                </div>

                <h2 class="section-title">Alta de profesor</h2>
                <p class="section-subtitle">Registra un nuevo docente en el catálogo</p>

                <div class="content-card">

                    <h3 class="card-title">Datos del profesor</h3>
                    <p class="card-subtitle">Todos los campos son obligatorios</p>
                    <hr class="card-divider"/>

                    <div class="form-field">
                        <h:outputLabel value="Nombre" />
                        <p:inputText styleClass="form-input-long" placeholder="Nombre del profesor"/>
                    </div>

                    <div class="form-field">
                        <h:outputLabel value="Apellido paterno" />
                        <p:inputText styleClass="form-input-long" placeholder="Apellido paterno"/>
                    </div>

                    <div class="form-field">
                        <h:outputLabel value="Apellido materno" />
                        <p:inputText styleClass="form-input-long" placeholder="Apellido materno"/>
                    </div>

                    <div class="form-field">
                        <h:outputLabel value="RFC" />
                        <p:inputText styleClass="form-input-short" placeholder="..."/>
                    </div>

                    <div class="form-actions">
                        <p:commandButton value="Guardar profesor" styleClass="btn-primary" ajax="false"/>
                        <p:commandButton value="Limpiar campos" styleClass="btn-primary" ajax="false"/>
                    </div>

                </div>

            </div>

        </div>

    </div>

    <script>
        function selectNav(el) {
            document.querySelectorAll('.nav-item').forEach(function(item) {
                item.classList.remove('active');
            });
            el.classList.add('active');
        }
    </script>
</h:body>
</html>
