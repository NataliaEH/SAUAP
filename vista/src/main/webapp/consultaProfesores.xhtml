<?xml version='1.0' encoding='UTF-8' ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/templates/layout.xhtml">

    <ui:param name="activePage" value="consultaProfesores"/>

    <ui:define name="title">SAUAP - Consulta de Profesores</ui:define>

    <ui:define name="content">

        <h2 class="section-title">Consulta General de Profesores</h2>
        <p class="section-subtitle">Consulta todos los profesores registrados en el catálogo y su información personal</p>

        <h:form id="consultaProfesoresForm">

            <div class="query-card">

                <p:messages id="messages" showDetail="true" closable="true" globalOnly="true" />

                <p:dataTable id="profesoresTable" widgetVar="profesoresTableWidget"
                             var="p" value="#{profesorUI.consultar()}"
                             styleClass="query-table">

                    <f:facet name="header">
                        <div class="query-toolbar">
                            <p:inputText id="globalFilter" styleClass="query-search"
                                         placeholder="Buscar por nombre de profesor"
                                         onkeyup="PF('profesoresTableWidget').filter()"/>
                        </div>
                    </f:facet>

                    <p:column headerText="ID">
                        <h:outputText value="#{p.id}"/>
                    </p:column>

                    <p:column headerText="Nombre" filterBy="#{p.nombre} #{p.apellidoPat} #{p.apellidoMat}" filterMatchMode="contains">
                        <f:facet name="filter">
                            <h:outputText value="" />
                        </f:facet>
                        <h:outputText value="#{p.nombre} #{p.apellidoPat} #{p.apellidoMat}"/>
                    </p:column>

                    <p:column headerText="RFC">
                        <h:outputText value="#{p.rfc}"/>
                    </p:column>

                    <p:column headerText="Acciones">

                        <p:commandButton value="Ver" type="button" styleClass="btn-table"
                                         onclick="PF('detalleDialog#{p.id}').show();"/>

                        <p:dialog widgetVar="detalleDialog#{p.id}" header="Detalle del profesor"
                                  modal="true" resizable="false" draggable="false" closable="true"
                                  appendTo="@(body)" styleClass="app-dialog detalle-dialog" width="758">

                            <div class="detalle-body">

                                <div class="detalle-field">
                                    <span class="detalle-label">ID</span>
                                    <span class="detalle-value">#{p.id}</span>
                                </div>
                                <div class="detalle-field">
                                    <span class="detalle-label">Nombre</span>
                                    <span class="detalle-value">#{p.nombre}</span>
                                </div>
                                <div class="detalle-field">
                                    <span class="detalle-label">Apellido paterno</span>
                                    <span class="detalle-value">#{p.apellidoPat}</span>
                                </div>
                                <div class="detalle-field">
                                    <span class="detalle-label">Apellido materno</span>
                                    <span class="detalle-value">#{p.apellidoMat}</span>
                                </div>
                                <div class="detalle-field">
                                    <span class="detalle-label">RFC</span>
                                    <span class="detalle-value">#{p.rfc}</span>
                                </div>

                                <h4 class="detalle-subtitle">Asignaciones realizadas</h4>
                                <p:dataTable var="a" value="#{p.getAsignaciones()}" emptyMessage="Sin asignaciones registradas"
                                styleClass="query-table detalle-table">
                                    <p:column headerText="Unidad de Aprendizaje">
                                        <h:outputText value="#{a.unidadAprendizaje.nombre}"/>
                                    </p:column>
                                    <p:column headerText="Grupo">
                                        <h:outputText value="#{a.grupo}"/>
                                    </p:column>
                                    <p:column headerText="Horas Clase">
                                        <h:outputText value="#{a.unidadAprendizaje.horasClase}"/>
                                    </p:column>
                                    <p:column headerText="Horas Taller">
                                        <h:outputText value="#{a.unidadAprendizaje.horasTaller}"/>
                                    </p:column>
                                    <p:column headerText="Horas Laboratorio">
                                        <h:outputText value="#{a.unidadAprendizaje.horasLaboratorio}"/>
                                    </p:column>
                                </p:dataTable>

                            </div>

                            <f:facet name="footer">
                                <div class="detalle-footer">
                                    <p:commandButton value="Cerrar" type="button" styleClass="btn-cerrar"
                                                     onclick="PF('detalleDialog#{p.id}').hide();"/>
                                </div>
                            </f:facet>

                        </p:dialog>

                    </p:column>

                </p:dataTable>

            </div>

        </h:form>

    </ui:define>

</ui:composition>
